name: Deploy Container Apps

on:
  push:
    branches:
      - main

env:
  # Resource Groups
  ACA_RG: rg-aca
  CAE_RG: rg-sql-mcp

  # Container App
  CONTAINER_APP_NAME: app-sample
  CONTAINER_APP_ENV: sql-mcp-env

  # Container Registry
  ACR_NAME: acrsqlmcpeastbluesv01
  IMAGE_NAME: sample-api

  # Log Analytics
  LAW_NAME: workspace-rgsqlmcpcHn1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 #v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps Extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade

      ############################################################
      # GitHub Runner Public IP
      ############################################################
      - name: Get Runner Public IP
        id: ip
        run: |
          echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      ############################################################
      # Allow ACR Firewall
      ############################################################
      - name: Allow Runner IP to ACR
        run: |
          az acr network-rule add \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }}

      - name: Wait Firewall Propagation
        run: sleep 60

      ############################################################
      # Login to ACR
      ############################################################
      - name: ACR Login
        run: |
          az acr login \
            --name $ACR_NAME

      ############################################################
      # Docker Build
      ############################################################
      - name: Build Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:latest \
            .

      ############################################################
      # Docker Push
      ############################################################
      - name: Push Image
        run: |
          docker push \
            $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

          docker push \
            $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

      ############################################################
      # Update Container App
      ############################################################
      - name: Update Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $ACA_RG \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      ############################################################
      # Show Revision
      ############################################################
      - name: Show Container App
        run: |
          az containerapp show \
            --name $CONTAINER_APP_NAME \
            --resource-group $ACA_RG \
            --query properties.latestRevisionName \
            -o tsv

      ############################################################
      # Cleanup Firewall Rule
      ############################################################
      - name: Remove Runner IP from ACR
        if: always()
        run: |
          az acr network-rule remove \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }}
