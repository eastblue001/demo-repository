name: Deploy Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # ===== 共通基盤（プラットフォームチームが管理）=====
  SHARED_RG: rg-sql-mcp
  CONTAINER_APP_ENV: cae-sql-mcp
  ACR_NAME: acrsqlmcpeastbluesv01
  MANAGED_IDENTITY_NAME: id-acr-pull

  # ===== 部署リソース（各部署が管理）=====
  DEPT_RG: rg-aca
  CONTAINER_APP_NAME: app-sample
  LOG_ANALYTICS_NAME: law-aca
  APP_INSIGHTS_NAME: appi-aca
  LOCATION: japaneast

  # ===== アプリ設定 =====
  IMAGE_NAME: sample-api
  TARGET_PORT: 3000

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI Extensions
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade
          az extension add --name application-insights --upgrade

      # ---------- 共通基盤の参照 ----------
      - name: Get Shared Resources
        id: shared
        run: |
          ENV_ID=$(az containerapp env show \
            --name $CONTAINER_APP_ENV \
            --resource-group $SHARED_RG \
            --query id -o tsv)

          ENV_STATE=$(az containerapp env show \
            --name $CONTAINER_APP_ENV \
            --resource-group $SHARED_RG \
            --query properties.provisioningState -o tsv)

          echo "Environment state: $ENV_STATE"
          if [ "$ENV_STATE" != "Succeeded" ]; then
            echo "::error::Container Apps Environment is not ready ($ENV_STATE)"
            exit 1
          fi

          IDENTITY_ID=$(az identity show \
            --name $MANAGED_IDENTITY_NAME \
            --resource-group $SHARED_RG \
            --query id -o tsv)

          echo "envId=$ENV_ID" >> $GITHUB_OUTPUT
          echo "identityId=$IDENTITY_ID" >> $GITHUB_OUTPUT

      # ---------- 部署リソースの準備 ----------
      - name: Ensure Log Analytics Workspace (Department)
        id: law
        run: |
          if ! az monitor log-analytics workspace show \
                --resource-group $DEPT_RG \
                --workspace-name $LOG_ANALYTICS_NAME >/dev/null 2>&1; then
            echo "Creating Log Analytics workspace..."
            az monitor log-analytics workspace create \
              --resource-group $DEPT_RG \
              --workspace-name $LOG_ANALYTICS_NAME \
              --location $LOCATION
          fi

          LAW_ID=$(az monitor log-analytics workspace show \
            --resource-group $DEPT_RG \
            --workspace-name $LOG_ANALYTICS_NAME \
            --query id -o tsv)

          echo "lawId=$LAW_ID" >> $GITHUB_OUTPUT

      - name: Ensure Application Insights (Department)
        run: |
          if ! az monitor app-insights component show \
                --app $APP_INSIGHTS_NAME \
                --resource-group $DEPT_RG >/dev/null 2>&1; then
            echo "Creating Application Insights..."
            az monitor app-insights component create \
              --app $APP_INSIGHTS_NAME \
              --resource-group $DEPT_RG \
              --location $LOCATION \
              --kind web \
              --application-type web \
              --workspace "${{ steps.law.outputs.lawId }}"
          fi

      # ---------- イメージのビルドと push ----------
      - name: Get Runner Public IP
        id: ip
        run: |
          echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Allow Runner IP to ACR
        run: |
          az acr network-rule add \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }}

      - name: ACR Login (wait for firewall propagation)
        run: |
          for i in $(seq 1 12); do
            if az acr login --name $ACR_NAME; then
              echo "ACR login succeeded"
              exit 0
            fi
            echo "Retry $i/12 ..."
            sleep 10
          done
          echo "::error::ACR login failed"
          exit 1

      - name: Build Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push \
            $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      # ---------- Container App のデプロイ ----------
      - name: Create or Update Container App
        run: |
          IMAGE=$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

          APPI_CONN=$(az monitor app-insights component show \
            --app $APP_INSIGHTS_NAME \
            --resource-group $DEPT_RG \
            --query connectionString -o tsv)
          echo "::add-mask::$APPI_CONN"

          if az containerapp show \
               --name $CONTAINER_APP_NAME \
               --resource-group $DEPT_RG >/dev/null 2>&1; then
            echo "Container App exists. Updating..."

            az containerapp secret set \
              --name $CONTAINER_APP_NAME \
              --resource-group $DEPT_RG \
              --secrets "appi-conn=$APPI_CONN"

            az containerapp update \
              --name $CONTAINER_APP_NAME \
              --resource-group $DEPT_RG \
              --image $IMAGE \
              --set-env-vars "APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appi-conn"
          else
            echo "Container App does not exist. Creating..."

            az containerapp create \
              --name $CONTAINER_APP_NAME \
              --resource-group $DEPT_RG \
              --environment "${{ steps.shared.outputs.envId }}" \
              --image $IMAGE \
              --target-port $TARGET_PORT \
              --ingress external \
              --user-assigned "${{ steps.shared.outputs.identityId }}" \
              --registry-server $ACR_NAME.azurecr.io \
              --registry-identity "${{ steps.shared.outputs.identityId }}" \
              --secrets "appi-conn=$APPI_CONN" \
              --env-vars "APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appi-conn" \
              --cpu 0.25 --memory 0.5Gi \
              --min-replicas 1 --max-replicas 3
          fi

      - name: Verify Latest Revision
        run: |
          for i in $(seq 1 30); do
            LATEST=$(az containerapp show -n $CONTAINER_APP_NAME -g $DEPT_RG \
              --query properties.latestRevisionName -o tsv)
            READY=$(az containerapp show -n $CONTAINER_APP_NAME -g $DEPT_RG \
              --query properties.latestReadyRevisionName -o tsv)

            echo "latest=$LATEST ready=$READY"
            if [ -n "$LATEST" ] && [ "$LATEST" = "$READY" ]; then
              echo "Revision $LATEST is ready."
              az containerapp show -n $CONTAINER_APP_NAME -g $DEPT_RG \
                --query "{revision:properties.latestRevisionName, fqdn:properties.configuration.ingress.fqdn, status:properties.runningStatus}" \
                -o table
              exit 0
            fi
            sleep 10
          done

          echo "::error::Revision did not become ready. Check revision status / ImagePull errors."
          az containerapp revision list -n $CONTAINER_APP_NAME -g $DEPT_RG -o table
          exit 1

      # ---------- 後片付け ----------
      - name: Remove Runner IP from ACR
        if: always() && steps.ip.outputs.ip != ''
        run: |
          az acr network-rule remove \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }} || true
