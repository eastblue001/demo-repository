name: Deploy Container Apps

on:
  push:
    branches:
      - main

env:
  ACA_RG: rg-aca
  CAE_RG: rg-sql-mcp

  CONTAINER_APP_NAME: app-sample
  CONTAINER_APP_ENV: sql-mcp-env

  ACR_NAME: acrsqlmcpeastbluesv01
  IMAGE_NAME: sample-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 #v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps Extension
        run: |
          az extension add \
            --name containerapp \
            --upgrade

      - name: Get Runner Public IP
        id: ip
        run: |
          echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Allow Runner IP to ACR
        run: |
          az acr network-rule add \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }}

      - name: Wait Firewall Propagation
        run: sleep 60

      - name: ACR Login
        run: |
          az acr login --name $ACR_NAME

      - name: Build Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

      - name: Get Environment Resource ID
        id: env
        run: |
          ENV_ID=$(az containerapp env show \
            --name $CONTAINER_APP_ENV \
            --resource-group $CAE_RG \
            --query id \
            -o tsv)

          echo "envId=$ENV_ID" >> $GITHUB_OUTPUT

      - name: Create or Update Container App
        run: |
          IMAGE=$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

          if az containerapp show \
              --name $CONTAINER_APP_NAME \
              --resource-group $ACA_RG >/dev/null 2>&1
          then
              echo "Container App exists. Updating..."

              az containerapp update \
                --name $CONTAINER_APP_NAME \
                --resource-group $ACA_RG \
                --image $IMAGE

          else
              echo "Container App does not exist. Creating..."

              az containerapp create \
                --name $CONTAINER_APP_NAME \
                --resource-group $ACA_RG \
                --environment "${{ steps.env.outputs.envId }}" \
                --image $IMAGE \
                --target-port 8080 \
                --ingress external \
                --registry-server $ACR_NAME.azurecr.io

          fi

      - name: Show Latest Revision
        run: |
          az containerapp show \
            --name $CONTAINER_APP_NAME \
            --resource-group $ACA_RG \
            --query properties.latestRevisionName \
            -o tsv

      - name: Remove Runner IP from ACR
        if: always()
        run: |
          az acr network-rule remove \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }}
