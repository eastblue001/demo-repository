name: Deploy Container Apps

on:
  push:
    branches:
      - main

  # Resource Groups
  ACA_RG: rg-aca
  CAE_RG: rg-sql-mcp

  # Resources
  CONTAINER_APP_NAME: app-sample
  CONTAINER_APP_ENV: cae-prod
  ACR_NAME: acrsqlmcpeastbluesv01
  IMAGE_NAME: sample-api

  # Log Analytics
  LAW_NAME: log-prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 #v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ##############################################################
      # GitHub Runner IP取得
      ##############################################################
      - name: Get Runner Public IP
        id: ip
        run: |
          echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      ##############################################################
      # ACR Firewall許可
      ##############################################################
      - name: Allow Runner IP
        run: |
          az acr network-rule add \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }}

      - name: Wait Firewall Propagation
        run: sleep 60

      ##############################################################
      # Build & Push
      ##############################################################
      - name: ACR Login
        run: az acr login --name $ACR_NAME

      - name: Build Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push \
            $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      ##############################################################
      # Log Analytics取得
      ##############################################################
      - name: Get Log Analytics Workspace Id
        id: law
        run: |
          LAW_ID=$(az monitor log-analytics workspace show \
            --resource-group $CAE_RG \
            --workspace-name $LAW_NAME \
            --query customerId \
            -o tsv)

          echo "workspaceId=$LAW_ID" >> $GITHUB_OUTPUT

      ##############################################################
      # Container Apps Deploy
      ##############################################################
      - name: Deploy Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $ACA_RG \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      ##############################################################
      # Cleanup
      ##############################################################
      - name: Remove Runner Firewall Rule
        if: always()
        run: |
          az acr network-rule remove \
            --name $ACR_NAME \
            --ip-address ${{ steps.ip.outputs.ip }}
